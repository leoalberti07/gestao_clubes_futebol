<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Jogadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex">

    <div class="container py-5">
        <h2>Histórico de Jogadores</h2>
        
        <form method="GET" class="mb-4">
            <div class="input-group">
                <input type="text" name="busca" class="form-control" placeholder="Buscar por nome...">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </form>

        <table class="table">
            <thead>
                <tr><th>Nome</th><th>Posição</th><th>Situação</th><th>Histórico</th></tr>
            </thead>
            <tbody>
                {% for j in jogadores %}
                <tr>
                    <td>{{ j.nome }}</td>
                    <td>{{ j.posicao }}</td>
                    <td>{{ j.situacao }}</td>
                    <td>{{ j.historico }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/jogadores" class="btn btn-link">← Voltar</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
