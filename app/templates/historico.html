<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Jogadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex">

    <div class="container mt-5 pt-4">
        <h2>Histórico de Jogadores</h2>
        
        <form method="GET" class="mb-4">
            <div class="input-group">
                <input type="text" name="busca" class="form-control" placeholder="Buscar por nome...">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th><th>Posição</th><th>Situação</th><th>Histórico</th><th>Salário</th><th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for j in jogadores %}
                    <tr>
                        <td>{{ j.nome }}</td>
                        <td>{{ j.posicao }}</td>
                        <td>{{ j.situacao }}</td>
                        <td>{{ j.historico }}</td>
                        <td>{{ j.salario }}</td>
                        <td>
                            <a href="{{ url_for('editar_jogador', id=j.id) }}" class="btn btn-sm btn-warning">Editar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a href="/jogadores" class="btn btn-link">← Voltar</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
